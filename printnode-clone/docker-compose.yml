version: '3.8'

services:
  printnode-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: printnode-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key}
    volumes:
      - ./server/database.sqlite:/app/database.sqlite
      - ./server/logs:/app/logs
    networks:
      - printnode-network

networks:
  printnode-network:
    driver: bridge
